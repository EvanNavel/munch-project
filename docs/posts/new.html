    <main role="main" class="container">
      <h1>Create New Post</h1>

<form enctype="multipart/form-data" action="../posts.html" accept-charset="UTF-8" method="post">

  <div class="mb-3"><label class="form-label required" for="post_title">Title</label><input required="required" aria-required="true" class="form-control" type="text" name="post[title]" id="post_title" /></div>
  <div class="mb-3"><label class="form-label required" for="post_description">Description</label><textarea placeholder="Summary of the post" required="required" aria-required="true" class="form-control" name="post[description]" id="post_description">
</textarea></div>
  <div class="mb-3"><label class="form-label required" for="post_ingredients">Ingredients</label><textarea placeholder="List of ingredients required" required="required" aria-required="true" class="form-control" name="post[ingredients]" id="post_ingredients">
</textarea></div>
  <div class="mb-3"><label class="form-label required" for="post_directions">Directions</label><textarea placeholder="Steps to prepare the recipe" required="required" aria-required="true" class="form-control" name="post[directions]" id="post_directions">
</textarea></div>

  <div>
    <label for="post_meal">Meal</label><br>
    <input value="" autocomplete="off" type="hidden" name="post[meal_tags]" id="post_meal_tags" />
    <select name="meal" id="meal" class="form-control" onchange="this.form[&#39;post[meal_tags]&#39;].value = this.value"><option value="" label=" "></option><option value="Breakfast">Breakfast</option>
<option value="Lunch">Lunch</option>
<option value="Dinner">Dinner</option>
<option value="Dessert">Dessert</option>
<option value="Snack">Snack</option></select>
  </div>

  <div>
    <label for="post_difficulty">Difficulty</label><br>
    <input value="" autocomplete="off" type="hidden" name="post[difficulty_tags]" id="post_difficulty_tags" />
    <select name="difficulty" id="difficulty" class="form-control" onchange="this.form[&#39;post[difficulty_tags]&#39;].value = this.value"><option value="" label=" "></option><option value="Easy">Easy</option>
<option value="Medium">Medium</option>
<option value="Hard">Hard</option>
<option value="Expert">Expert</option></select>
  </div>

  <div>
    <div class="mb-3"><label class="form-label" for="post_cuisine_tags">Cuisine tags</label><input placeholder="e.g. American, Italian (separate with commas)" value="" class="form-control" type="text" name="post[cuisine_tags]" id="post_cuisine_tags" /></div>
  </div>

  <div>
    <div class="mb-3"><label class="form-label" for="post_dietary_tags">Dietary tags</label><input placeholder="e.g. Gluten Free, Vegan (separate with commas)" value="" class="form-control" type="text" name="post[dietary_tags]" id="post_dietary_tags" /></div>
  </div>

  <div>
    <label for="post_image">Upload Image</label>
    <div class="mb-3"><label class="form-label" for="post_image">Image</label><input accept="image/jpeg,image/png" class="form-control" type="file" name="post[image]" id="post_image" /></div>
  </div>

  <input type="submit" name="commit" value="Create Post" class="btn btn-primary" data-disable-with="Create Post" />

</form>

  <script src="../assets/bootstrap.min-67c48d88a8e0be178058aacb338b084191ed6d65c8fef751c50248202cf1488a.js"></script>
<script>
(function () {
  var root = "../";
  var tags = ["American", "Breakfast", "Chinese", "Dinner", "Easy", "Gluten Free", "Hard", "Indian", "Low Carb", "Lunch", "Medium", "Mexican", "Snack", "Vegan"];
  var toast = document.createElement("div");
  toast.className = "snapshot-toast";
  document.body.appendChild(toast);
  function notify(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toast.classList.remove("show"); }, 2200);
  }
  document.addEventListener("submit", function (e) {
    e.preventDefault();
    if (e.target.id === "search-form") {
      var term = (e.target.querySelector("input[name=search]").value || "").trim().toLowerCase();
      var tag = tags.find(function (t) { return t.toLowerCase() === term; });
      if (tag) { location.href = root + "posts@search=" + tag.replace(/ /g, "+") + ".html"; return; }
      notify("Search needs the live app. Try a tag like Vegan, Dinner, or Mexican.");
      return;
    }
    notify("This is a static snapshot, so buttons and forms are disabled.");
  }, true);
  document.addEventListener("click", function (e) {
    var a = e.target.closest("a[data-snapshot-disabled]");
    if (a) { e.preventDefault(); notify("That page needs the live app."); }
  });
})();
</script>
