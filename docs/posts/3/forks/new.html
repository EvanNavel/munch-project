    <main role="main" class="container">
      <h1>New Fork</h1>

<form data-turbo="false" enctype="multipart/form-data" action="#" accept-charset="UTF-8" method="post">
  <div>
    <label for="fork_title">Title</label>
    <input value="Vegetable Stir Fry" type="text" name="fork[title]" id="fork_title" />
  </div>

  <div>
    <label for="fork_description">Description</label>
  <textarea placeholder="Summary of the post" name="fork[description]" id="fork_description">
A quick and healthy meal packed with veggies.</textarea>
  </div>

  <div>
  <label for="fork_ingredients">Ingredients</label>
  <textarea placeholder="List of ingredients required" name="fork[ingredients]" id="fork_ingredients">
- 2 tablespoons vegetable oil
- 1 onion, sliced
- 2 cloves garlic, minced
- 1 bell pepper, sliced
- 1 carrot, sliced
- 1 zucchini, sliced
- 2 tablespoons soy sauce</textarea>
  </div>

  <div>
  <label for="fork_directions">Directions</label>
  <textarea placeholder="Steps to prepare the recipe" name="fork[directions]" id="fork_directions">
1. Heat the oil in a wok or large frying pan.
2. Add the onion and garlic and stir-fry for 2 minutes.
3. Add the rest of the vegetables and stir-fry for another 5 minutes.
4. Add the soy sauce and stir-fry for another 2 minutes.</textarea>
  </div>

  <div>
    <label for="fork_meal">Type of Meal</label>
    <input value="" autocomplete="off" type="hidden" name="fork[meal_tags]" id="fork_meal_tags" />
    <select name="meal" id="meal" class="form-control" onchange="this.form[&#39;fork[meal_tags]&#39;].value = this.value"><option value="" label=" "></option><option value="Breakfast">Breakfast</option>
<option value="Lunch">Lunch</option>
<option value="Dinner">Dinner</option>
<option value="Dessert">Dessert</option>
<option value="Snack">Snack</option></select>
  </div>

  <div>
    <label for="fork_difficulty">Difficulty</label>
    <input value="" autocomplete="off" type="hidden" name="fork[difficulty_tags]" id="fork_difficulty_tags" />
    <select name="difficulty" id="difficulty" class="form-control" onchange="this.form[&#39;fork[difficulty_tags]&#39;].value = this.value"><option value="" label=" "></option><option value="Easy">Easy</option>
<option value="Medium">Medium</option>
<option value="Hard">Hard</option>
<option value="Expert">Expert</option></select>
  </div>

  <div>
    <label for="fork_cuisine">Cuisine</label>
    <input value="" placeholder="e.g. American, Italian (separate with commas)" type="text" name="fork[cuisine_tags]" id="fork_cuisine_tags" />
  </div>

  <div>
    <label for="fork_dietary">Dietary Restrictions</label>
    <input value="" placeholder="e.g. Gluten Free, Vegan (separate with commas)" type="text" name="fork[dietary_tags]" id="fork_dietary_tags" />
  </div>

  <div>
    <label for="fork_image">Upload Image</label>
    <input accept="image/jpeg,image/png" type="file" name="fork[image]" id="fork_image" />
  </div>

  <div>
    <input type="submit" name="commit" value="Create Fork" class="btn btn-primary" data-disable-with="Create Fork" />
  </div>

  <a href="../../3.html">Back</a>
</form>

  <script src="../../../assets/bootstrap.min-67c48d88a8e0be178058aacb338b084191ed6d65c8fef751c50248202cf1488a.js"></script>
<script>
(function () {
  var root = "../../../";
  var tags = ["American", "Breakfast", "Chinese", "Dinner", "Easy", "Gluten Free", "Hard", "Indian", "Low Carb", "Lunch", "Medium", "Mexican", "Snack", "Vegan"];
  var toast = document.createElement("div");
  toast.className = "snapshot-toast";
  document.body.appendChild(toast);
  function notify(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toast.classList.remove("show"); }, 2200);
  }
  document.addEventListener("submit", function (e) {
    e.preventDefault();
    if (e.target.id === "search-form") {
      var term = (e.target.querySelector("input[name=search]").value || "").trim().toLowerCase();
      var tag = tags.find(function (t) { return t.toLowerCase() === term; });
      if (tag) { location.href = root + "posts@search=" + tag.replace(/ /g, "+") + ".html"; return; }
      notify("Search needs the live app. Try a tag like Vegan, Dinner, or Mexican.");
      return;
    }
    notify("This is a static snapshot, so buttons and forms are disabled.");
  }, true);
  document.addEventListener("click", function (e) {
    var a = e.target.closest("a[data-snapshot-disabled]");
    if (a) { e.preventDefault(); notify("That page needs the live app."); }
  });
})();
</script>
